            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        }

            max-width: 600px;
            width: 100%;

        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;

            margin-bottom: 10px;
        }

        .data {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .dia-numero {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }

        .frase-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .frase-texto {
            color: white;
            font-size: 20px;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 20px;
            font-style: italic;
        }

        .frase-referencia {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 600;
        }

        .botoes {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

            background: #10b981;
        }

        .compartilhar:hover {
            background: #059669;
        }

        .footer {
            color: #999;
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .frase-texto {

            }

</head>

        let fraseAtual = obterFraseDodia();

        function obterFraseDodia() {
            const hoje = new Date();
            const anoNovo = new Date(hoje.getFullYear(), 0, 1);
            const diaDoAno = Math.floor((hoje - anoNovo) / (24 * 60 * 60 * 1000)) + 1;
            return diaDoAno - 1; // Índice da array (0-364)
        }

        function atualizarDisplay() {
            const frase = frases[fraseAtual];
            document.getElementById('fraseTexto').textContent = `"${frase.texto}"`;
            document.getElementById('fraseReferencia').textContent = frase.referencia;
            document.getElementById('diaDoAno').textContent = fraseAtual + 1;

            const hoje = new Date();
            const opcoes = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dataFormatada = hoje.toLocaleDateString('pt-BR', opcoes);
            document.getElementById('dataAtual').textContent = dataFormatada;
        }

        function proximaFrase() {
            if (fraseAtual < frases.length - 1) {
                fraseAtual++;
                atualizarDisplay();
            }
        }

        function fraseAnterior() {
            if (fraseAtual > 0) {
                fraseAtual--;
                atualizarDisplay();
            }
        }

        function compartilhar() {
            const frase = frases[fraseAtual];
            const texto = `${frase.texto}\n\n${frase.referencia}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Frase Bíblica do Dia',
                    text: texto
                });
            } else {
                // Fallback para copiar para clipboard
                navigator.clipboard.writeText(texto).then(() => {
                    alert('Frase copiada!');
                });
            }
        }

        // Inicializar
        atualizarDisplay();
    </script>
